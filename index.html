<style>

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}

<script>
(()=>{

/* ---------- state ---------- */
let S=null;                 // {fmt,W,H,bg,objs}
let assets={};              // id -> {url,w,h,name}
const imgCache=new Map();   // id -> HTMLImageElement
let selId=null;
let RS=1;                   // render scale (shadow/filter pixels are not transformed by the CTM)
const view={zoom:'fit',z:1,guides:{thirds:false,center:false,safe:false,yt:false},snap:[]};

const defBg=()=>({type:'gradient',c1:'#10163a',c2:'#6a2bd9',angle:135,asset:null,fit:'cover',px:50,py:50,vig:0,f:{brightness:100,contrast:100,saturate:100,blur:0,hue:0,gray:0,sepia:0}});
const defFilters=()=>({brightness:100,contrast:100,saturate:100,blur:0,hue:0,gray:0,sepia:0});
const baseObj=(type,o)=>Object.assign({id:nid(),type,name:'',x:0,y:0,w:200,h:200,rot:0,opacity:1,blend:'source-over',visible:true,locked:false,flipH:false,flipV:false,
  shadow:{on:false,color:'#000000',a:.6,blur:24,x:0,y:8}},o);
const newText=o=>baseObj('text',Object.assign({text:'NÁPIS',font:'Anton',size:150,weight:400,italic:false,align:'center',color:'#ffffff',
  stroke:{w:0,color:'#000000'},ls:0,lh:1.05,upper:false,box:{on:false,color:'#ffd23f',pad:22,radius:12},w:800,h:160},o));
const newShape=(shape,o)=>baseObj('shape',Object.assign({shape,fillOn:true,fill:'#ff9c3a',grad:false,fill2:'#ff3d81',angle:90,stroke:{w:0,color:'#ffffff'},radius:shape==='round'?40:0,w:300,h:300},o));
const newImage=(asset,w,h,o)=>baseObj('image',Object.assign({asset,w,h,fit:'cover',px:50,py:50,radius:0,border:{w:0,color:'#ffffff'},f:defFilters()},o));
const objLabel=o=>o.name||(o.type==='text'?(o.text.split('\n')[0].slice(0,24)||'Text'):o.type==='image'?(assets[o.asset]?.name||'Obrázek'):(SHAPES.find(s=>s[0]===o.shape)||['', 'Tvar'])[1]);
const typeLabel=o=>({text:'Text',image:'Obrázek',shape:'Tvar'}[o.type]);

/* ---------- images ---------- */
const loadImg=url=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
const getImg=id=>imgCache.get(id)||null;
async function importImage(file){
  const tmp=URL.createObjectURL(file);
  try{
    const im=await loadImg(tmp);
    let w=im.naturalWidth||1024,h=im.naturalHeight||1024;
    const s=Math.min(1,2560/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const keepAlpha=/png|webp|gif|svg/.test(file.type);
    const url=c.toDataURL(keepAlpha?'image/png':'image/jpeg',.92);
    const id=nid();
    assets[id]={url,w:c.width,h:c.height,name:file.name.replace(/\.[^.]+$/,'')};
    imgCache.set(id,await loadImg(url));
    return id;
  }finally{URL.revokeObjectURL(tmp);}
}

/* ---------- rendering ---------- */
const mcv=document.createElement('canvas'); const mctx=mcv.getContext('2d');
const tcv=document.createElement('canvas');
const fontStr=o=>`${o.italic?'italic ':''}${o.weight} ${o.size}px "${o.font}", sans-serif`;
function rr(g,x,y,w,h,r){
  r=clamp(r||0,0,Math.min(w,h)/2);g.beginPath();
  if(!r){g.rect(x,y,w,h);return;}
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function filterStr(f,k){
  const p=[];
  if(f.brightness!==100)p.push(`brightness(${f.brightness}%)`);
  if(f.contrast!==100)p.push(`contrast(${f.contrast}%)`);
  if(f.saturate!==100)p.push(`saturate(${f.saturate}%)`);
  if(f.hue)p.push(`hue-rotate(${f.hue}deg)`);
  if(f.gray)p.push(`grayscale(${f.gray}%)`);
  if(f.sepia)p.push(`sepia(${f.sepia}%)`);
  if(f.blur)p.push(`blur(${f.blur*k}px)`);
  return p.join(' ')||'none';
}
function drawFit(g,im,x,y,w,h,fit,px,py){
  const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
  if(fit==='stretch'){g.drawImage(im,x,y,w,h);return;}
  const s=fit==='contain'?Math.min(w/iw,h/ih):Math.max(w/iw,h/ih);

  g.drawImage(im,x+(w-dw)*(px/100),y+(h-dh)*(py/100),dw,dh);

/* ---------- geometry ---------- */
const getSel=()=>S.objs.find(o=>o.id===selId)||null;

/* ---------- overlay: guides, selection ---------- */

    for(const f of[1/3,2/3]){g.moveTo(W*f,0);g.lineTo(W*f,H);g.moveTo(0,H*f);g.lineTo(W,H*f);}g.stroke();}
  if(gv.center){g.strokeStyle='rgba(90,220,255,.8)';g.setLineDash([]);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();}

/* ---------- history ---------- */

/* ---------- pointer interaction ---------- */
let drag=null;
function pickHandle(o,p,u,touch){

    else{select(null);return;}
  }
  const o=getSel();

const endDrag=()=>{if(!drag)return;const m=drag.moved;drag=null;view.snap=[];if(m)commit();req();};
cwrap.addEventListener('pointerup',endDrag);
cwrap.addEventListener('pointercancel',endDrag);
cwrap.addEventListener('dblclick',e=>{

function doMove(o,p,e,u){

/* ---------- keyboard and paste ---------- */
const typing=t=>t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
document.addEventListener('keydown',e=>{
  if(typing(e.target)||$('#modal').hidden===false)return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),o=getSel();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();dupSel();return;}
  if(mod&&k==='c'&&o){e.preventDefault();copySel();return;}
  if(mod&&k==='v'&&clip){e.preventDefault();pasteSel();return;}
  if(mod&&k==='s'){e.preventDefault();tab='export';renderPane();return;}
  if(!o)return;
  if(k==='delete'||k==='backspace'){e.preventDefault();delSel();return;}
  if(k==='escape'){select(null);return;}
  if(k==='['){reorder(o.id,-1);return;}
  if(k===']'){reorder(o.id,1);return;}
  const d=e.shiftKey?10:1;
  if(k.startsWith('arrow')&&!o.locked){
    e.preventDefault();
    if(k==='arrowleft')o.x-=d;if(k==='arrowright')o.x+=d;if(k==='arrowup')o.y-=d;if(k==='arrowdown')o.y+=d;
    syncProps();req();clearTimeout(drag_t);drag_t=setTimeout(commit,350);
  }
});
let drag_t=0;
document.addEventListener('paste',async e=>{
  if(typing(e.target))return;
  const files=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){e.preventDefault();await addFiles(files);}
});
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});
document.addEventListener('drop',async e=>{
  if(!e.dataTransfer?.files?.length)return;e.preventDefault();await addFiles(e.dataTransfer.files);
});

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}
function ask(title,text,okLabel='Pokračovat'){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button type="button" class="btn pri" data-ok>${esc(okLabel)}</button><button type="button" class="btn" data-no>Zrušit</button></div></div>`;
    m.hidden=false;const done=v=>{m.hidden=true;m.innerHTML='';res(v);};
    $('[data-ok]',m).onclick=()=>done(true);$('[data-no]',m).onclick=()=>done(false);
    m.onclick=e=>{if(e.target===m)done(false);};$('[data-ok]',m).focus();
  });
}

function centerObj(o){o.x=Math.round((S.W-o.w)/2);o.y=Math.round((S.H-o.h)/2);return o;}
function addText(preset){

function addShape(shape){
  const m=Math.min(S.W,S.H),o=newShape(shape);
  if(shape==='line'){o.w=Math.round(S.W*.5);o.h=14;}
  else if(shape==='arrow'){o.w=Math.round(m*.55);o.h=Math.round(m*.28);o.fill='#ff2d2d';o.stroke={w:6,color:'#ffffff'};}
  else{o.w=o.h=Math.round(m*.35);if(shape==='rect'||shape==='round')o.h=Math.round(m*.25);}

async function addFiles(files){
  let n=0;
  for(const f of files){

    try{addImageObj(await importImage(f));n++;}catch(err){toast('Obrázek '+f.name+' se nepodařilo načíst');}
  }
  if(n)toast(n===1?'Obrázek přidán':n+' obrázky přidány');
}

function setOut(el){
  const out=el.closest('label')?.querySelector('output');if(!out)return;
  const k=+(el.dataset.k||1);out.textContent=(Math.round(el.value*10)/10)+(el.dataset.u||'');
}
function syncProps(){
  if(tab!=='props')return;
  const o=getSel();
  $$('#pane [data-p]').forEach(el=>{
    if(document.activeElement===el)return;
    const t=el.dataset.t==='bg'?S.bg:o;if(!t)return;
    const v=getP(t,el.dataset.p),k=+(el.dataset.k||1);
    if(el.type==='checkbox')el.checked=!!v;
    else if(el.type==='range'||el.type==='number'){el.value=Math.round(v/k*10)/10;setOut(el);}
    else el.value=v;
  });
  $$('#pane [data-set]').forEach(b=>{
    const t=b.dataset.t==='bg'?S.bg:o;if(!t)return;
    b.setAttribute('aria-pressed',String(String(getP(t,b.dataset.set))===b.dataset.v));
  });
}
const parseV=v=>v==='true'?true:v==='false'?false:v;
function ensureFont(o){
  if(o.type!=='text')return Promise.resolve();
  return document.fonts.load(fontStr(o),'Aáčďéěíňóřšťúůýž').then(req,()=>{});
}
const pane=$('#pane');
pane.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.exp)return expInput(el);
  if(!el.dataset.p)return;
  const t=el.dataset.t==='bg'?S.bg:getSel();if(!t)return;
  let v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='range'||el.type==='number'){if(el.value==='')return;v=parseFloat(el.value)*(+(el.dataset.k||1));}
  else if(el.dataset.num)v=Number(el.value);
  else v=el.value;
  setP(t,el.dataset.p,v);
  if(el.type==='range')setOut(el);
  if(el.dataset.p==='font'||el.dataset.p==='weight')ensureFont(t);
  req();
});
pane.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset.p)return;
  commit();
  if(el.dataset.r!==undefined)renderPane();
  else if(el.dataset.p==='text'||el.dataset.p==='name')updateLayersMaybe();
});
function updateLayersMaybe(){}
pane.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-layer],#drop');if(!b)return;
  if(b.id==='drop'){$('#fileImg').click();return;}
  if(b.dataset.add){
    if(b.dataset.add==='text')addText(TEXT_PRESETS[+b.dataset.i]);
    else if(b.dataset.add==='shape')addShape(b.dataset.v);
    else addSticker(b.dataset.v);
    return;
  }
  if(b.dataset.tpl){applyTemplate(b.dataset.tpl);return;}
  if(b.dataset.set){
    const t=b.dataset.t==='bg'?S.bg:getSel();if(!t)return;
    setP(t,b.dataset.set,parseV(b.dataset.v));commit();
    if(b.dataset.r!==undefined)renderPane();else syncProps();
    if(b.dataset.set==='italic')ensureFont(t);
    req();return;
  }
  if(b.dataset.exp){expClick(b);return;}
  if(b.dataset.act){await action(b);return;}
  if(b.dataset.layer!==undefined){
    if(b.dataset.layer==='bg'){selId=null;tab='props';renderPane();req();}
    else select(b.dataset.layer);
  }
});
pane.addEventListener('dblclick',e=>{

pane.addEventListener('keydown',e=>{

async function action(b){
  const a=b.dataset.act,id=b.dataset.id,o=id?S.objs.find(x=>x.id===id):getSel();
  switch(a){
    case 'vis':if(o){o.visible=!o.visible;commit();renderPane();req();}break;
    case 'lock':if(o){o.locked=!o.locked;commit();renderPane();req();}break;
    case 'fwd':reorder(id||selId,1);break;
    case 'back':reorder(id||selId,-1);break;
    case 'rm':if(id&&id!==selId)selId=id;delSel();break;
    case 'dup':dupSel();break;
    case 'flipH':if(o){o.flipH=!o.flipH;commit();req();}break;
    case 'flipV':if(o){o.flipV=!o.flipV;commit();req();}break;
    case 'al':alignSel(b.dataset.v);break;
    case 'glow':if(o){o.shadow={on:true,color:o.type==='text'?o.color:o.type==='shape'?o.fill:'#ffffff',a:1,blur:60,x:0,y:0};commit();renderPane();req();}break;
    case 'soft':if(o){o.shadow={on:true,color:'#000000',a:.55,blur:28,x:0,y:10};commit();renderPane();req();}break;
    case 'hard':if(o){o.shadow={on:true,color:'#000000',a:1,blur:0,x:10,y:10};commit();renderPane();req();}break;
    case 'resetf':if(o){o.f=defFilters();commit();syncProps();req();}break;
    case 'asbg':if(o&&o.type==='image'){S.bg.type='image';S.bg.asset=o.asset;S.objs=S.objs.filter(x=>x!==o);selId=null;commit();renderPane();req();toast('Obrázek je teď pozadí');}break;
    case 'bgfile':$('#fileBg').click();break;
    case 'gp':{const g=GRADS[+b.dataset.i];S.bg.type='gradient';S.bg.c1=g[0];S.bg.c2=g[1];S.bg.angle=g[2];commit();renderPane();req();break;}
  }
}

function tplState(id,fmt){
  const {W,H}=FORMATS[fmt],t=TEMPLATES.find(x=>x.id===id),b=t.build(W,H);
  return {fmt,W,H,bg:b.bg,objs:b.objs};
}
const fontsFor=objs=>Promise.all(objs.filter(o=>o.type==='text').map(o=>document.fonts.load(fontStr(o),'Aáčďéěíňóřšťúůýž').catch(()=>{})));
async function applyTemplate(id){
  const st=tplState(id,S.fmt);
  S.bg=st.bg;S.objs=st.objs;selId=null;tab='add';
  await fontsFor(S.objs);commit();renderPane();req();toast('Šablona použita');
}
function drawThumbs(){
  $$('#tpls .tpl').forEach(el=>{
    const c=$('canvas',el),st=tplState(el.dataset.tpl,S.fmt),keep=S,k=c.width/st.W;
    S=st;RS=k;const g=c.getContext('2d');g.setTransform(k,0,0,k,0,0);render(g,st.W,st.H);S=keep;RS=1;
  });
  fontsFor(TEMPLATES.flatMap(t=>tplState(t.id,S.fmt).objs)).then(()=>{if(tab==='add'&&$('#tpls')){
    $$('#tpls .tpl').forEach(el=>{const c=$('canvas',el),st=tplState(el.dataset.tpl,S.fmt),keep=S,k=c.width/st.W;
      S=st;RS=k;const g=c.getContext('2d');g.setTransform(k,0,0,k,0,0);render(g,st.W,st.H);S=keep;RS=1;});}});
}

/* ---------- format switch ---------- */
$$('[data-fmt]').forEach(b=>b.addEventListener('click',()=>{
  const f=b.dataset.fmt;if(f===S.fmt)return;
  const n=FORMATS[f],s=Math.min(n.W/S.W,n.H/S.H);
  for(const o of S.objs){
    const cx=(o.x+o.w/2)/S.W*n.W,cy=(o.y+o.h/2)/S.H*n.H;
    o.w=Math.round(o.w*s);o.h=Math.round(o.h*s);
    if(o.type==='text'){o.size=Math.max(8,Math.round(o.size*s));o.box.pad=Math.round(o.box.pad*s);o.stroke.w=Math.round(o.stroke.w*s);}
    if(o.type==='shape')o.stroke.w=Math.round(o.stroke.w*s);
    if(o.shadow){o.shadow.blur=Math.round(o.shadow.blur*s);o.shadow.x=Math.round(o.shadow.x*s);o.shadow.y=Math.round(o.shadow.y*s);}
    o.x=Math.round(cx-o.w/2);o.y=Math.round(cy-o.h/2);
  }
  S.fmt=f;S.W=n.W;S.H=n.H;view.zoom='fit';commit();layout();renderPane();
  toast('Formát '+f+': rozložení je přepočítané, dolaď ho ručně');
}));

function expInput(el){
  const k=el.dataset.exp;
  if(k==='scale')exp.scale=Number(el.value);
  else if(k==='q'){exp.q=Number(el.value)/100;$('#qout').textContent=el.value+' %';}
  else if(k==='name')exp.name=el.value;
  if(k!=='name')updateSize();
}
function expClick(b){
  const k=b.dataset.exp;
  if(k==='fmt'){exp.fmt=b.dataset.v;renderPane();}
  else if(k==='save')saveImage();
  else if(k==='savePrj')saveProject();
  else if(k==='loadPrj')$('#filePrj').click();
}
async function buildBlob(){
  await fontsFor(S.objs);
  const k=exp.scale,c=document.createElement('canvas');
  c.width=Math.round(S.W*k);c.height=Math.round(S.H*k);
  const g=c.getContext('2d');RS=k;g.scale(k,k);render(g,S.W,S.H);RS=1;
  const mime={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[exp.fmt];
  return new Promise(r=>c.toBlob(b=>r(b),mime,exp.q));
}
let sizeT=0,sizeTok=0;
function updateSize(){
  clearTimeout(sizeT);
  sizeT=setTimeout(async()=>{
    const tok=++sizeTok,note=$('#sizenote');if(!note)return;
    note.className='note';note.textContent='Počítám velikost…';
    const blob=await buildBlob();if(tok!==sizeTok||!$('#sizenote'))return;
    if(!blob){note.textContent='Velikost se nepodařilo spočítat.';return;}
    const kb=blob.size/1024,txt=kb>1024?(kb/1024).toFixed(2)+' MB':Math.round(kb)+' kB';
    const w=Math.round(S.W*exp.scale),h=Math.round(S.H*exp.scale);
    if(blob.size>2*1024*1024){note.className='note warn';note.textContent=`${w} × ${h} px · ${txt}. Přes 2 MB, YouTube miniaturu odmítne. Zkus JPG, nižší kvalitu nebo menší velikost.`;}
    else note.textContent=`${w} × ${h} px · ${txt}`;
  },350);
}
let dlP=null;
const getDL=()=>dlP||(dlP=(window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)).catch(()=>null));
async function saveFile(fn,data){
  const dl=await getDL();
  if(dl){
    try{const r=await dl.save({filename:fn,data});toast(r.status==='saved'?'Uloženo: '+fn:'Odesláno');return;}
    catch(err){if(err&&err.code==='declined'){toast('Ukládání zrušeno');return;}}
  }
  showFallback(fn,data);
}
function showFallback(fn,data){
  const m=$('#modal');let body='';
  if(typeof data!=='string'){
    const url=URL.createObjectURL(data);
    body=`<p>Přímé uložení tu není k dispozici. Podrž prst na obrázku, nebo na něj klikni pravým tlačítkem, a vyber Uložit obrázek.</p><img src="${url}" alt="${esc(fn)}">`;
  }else body=`<p>Přímé uložení tu není k dispozici. Zkopíruj obsah a ulož ho do souboru ${esc(fn)}.</p><label class="f"><textarea id="fbtxt" rows="8" readonly></textarea></label>`;
  m.innerHTML=`<div class="card"><h2>Uložení souboru</h2>${body}<div class="row"><button type="button" class="btn" data-no>Zavřít</button></div></div>`;
  if(typeof data==='string')$('#fbtxt',m).value=data;
  m.hidden=false;const close=()=>{m.hidden=true;m.innerHTML='';};
  $('[data-no]',m).onclick=close;m.onclick=e=>{if(e.target===m)close();};
}
async function saveImage(){
  const blob=await buildBlob();if(!blob){toast('Export se nepodařil');return;}
  const nm=(exp.name||'miniatura').replace(/[^\w\- ]+/g,'').trim()||'miniatura';
  await saveFile(`${nm}-${S.fmt.replace(':','x')}.${exp.fmt}`,blob);
}

/* ---------- project: save, load, autosave ---------- */
function usedAssets(){
  const ids=new Set(S.objs.filter(o=>o.type==='image').map(o=>o.asset));if(S.bg.asset)ids.add(S.bg.asset);
  const out={};ids.forEach(i=>{if(assets[i])out[i]=assets[i];});return out;
}
const projectJSON=()=>JSON.stringify({v:1,fmt:S.fmt,W:S.W,H:S.H,bg:S.bg,objs:S.objs,assets:usedAssets()});
async function saveProject(){await saveFile('miniatura-projekt.json',projectJSON());}
async function loadProject(d){
  if(!d||!Array.isArray(d.objs)||!FORMATS[d.fmt]||!d.bg)throw new Error('bad');
  const as=d.assets||{},ids=Object.keys(as),next=new Map();
  await Promise.all(ids.map(async i=>{next.set(i,await loadImg(as[i].url));}));
  assets=as;imgCache.clear();next.forEach((v,k)=>imgCache.set(k,v));
  S={fmt:d.fmt,W:FORMATS[d.fmt].W,H:FORMATS[d.fmt].H,bg:Object.assign(defBg(),d.bg),objs:d.objs};
  selId=null;hist=[];hi=-1;
  await fontsFor(S.objs);commit();view.zoom='fit';layout();renderPane();
}
$('#filePrj').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{await loadProject(JSON.parse(await f.text()));toast('Projekt načten');}catch(err){toast('Soubor není platný projekt');}
};
$('#newp').onclick=async()=>{
  if(!await ask('Nový projekt','Aktuální plátno se nahradí ukázkovou šablonou. Rozdělanou práci uložíš tlačítkem Export → Uložit projekt.','Začít znovu'))return;
  const st=tplState('fire',S.fmt);S.bg=st.bg;S.objs=st.objs;selId=null;assets={};imgCache.clear();
  hist=[];hi=-1;await fontsFor(S.objs);commit();tab='add';layout();renderPane();
};
const idb={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('mustek-miniatur',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}};
let booted=false;
function scheduleSave(){if(!booted)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{idb.set('cur',projectJSON()).catch(()=>{});}catch(e){}},900);}

/* ---------- start ---------- */
(async function init(){
  const st=tplState('fire','16:9');S=st;
  layout();commit();renderPane();
  try{
    const saved=await Promise.race([idb.get('cur'),new Promise(r=>setTimeout(()=>r(null),1500))]);
    if(saved){await loadProject(JSON.parse(saved));toast('Obnoven poslední projekt');}
  }catch(e){}
  booted=true;
  await Promise.all(FONTS.map(f=>document.fonts.load(`400 40px "${f}"`,'Aáčďéěíňóřšťúůýž').catch(()=>{})));
  await fontsFor(S.objs);req();if(tab==='add')drawThumbs();
  document.fonts.ready.then(req);
})();
})();
</script>

</body></html>
